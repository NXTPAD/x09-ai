name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run API tests
        run: npm test

      - run: npm install

      - name: Find (or create) the x09-db database and fill in its ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q "PASTE_YOUR_D1_DATABASE_ID" wrangler.toml; then
            find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="x09-db");process.stdout.write(db?db.uuid:"")})'; }
            ID=$(find_id)
            if [ -z "$ID" ]; then
              echo "x09-db not found — creating it"
              npx wrangler d1 create x09-db
              ID=$(find_id)
            fi
            if [ -z "$ID" ]; then echo "Could not find or create the x09-db database"; exit 1; fi
            sed -i "s/PASTE_YOUR_D1_DATABASE_ID/$ID/" wrangler.toml
            echo "Using D1 database $ID"
          fi

      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply x09-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
